<div class="w-full overflow-hidden rounded-2xl bg-zinc-900 shadow-lg transition duration-300 hover:-translate-y-2 hover:shadow-2xl">

  <img
    [src]="movie().poster"
    [alt]="movie().title"
    class="h-80 w-full object-cover"
  >

  <div class="p-4 text-right" dir="rtl">

    <h2 class="mb-2 text-xl font-bold text-white">
      {{ movie().title }}
    </h2>

    <p class="mb-2 text-sm text-zinc-400">
      {{ movie().genre }}
    </p>

    <div class="flex items-center justify-between">

      <span class="text-sm text-zinc-400">
        {{ movie().duration }} دقیقه
      </span>

      <span class="font-bold text-yellow-400">
        ⭐ {{ movie().rating }}
      </span>

    </div>

  </div>

</div>
